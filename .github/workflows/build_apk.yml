name: Build APK via Telegram
on:
  repository_dispatch:
    types: [build-apk]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      
      - name: Install buildozer and compatible jnius
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.36
          pip install "jnius>=1.4.0"
      
      - name: Accept Android SDK licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
      
      - name: Download and prepare source
        run: |
          curl -f -L -o app.zip "${{ github.event.client_payload.zip_url }}"
          mkdir app_source
          unzip -q app.zip -d app_source
          cd app_source
          
          # Handle nested folder
          if [ $(find . -maxdepth 1 -type d ! -name . | wc -l) -eq 1 ]; then
            SUBDIR=$(find . -maxdepth 1 -type d ! -name . | head -n 1)
            if [ -f "$SUBDIR/main.py" ] || [ -f "$SUBDIR/buildozer.spec" ]; then
              shopt -s dotglob
              mv "$SUBDIR"/* .
              rm -rf "$SUBDIR"
            fi
          fi
          
          # Create buildozer.spec if not exists
          if [ ! -f "buildozer.spec" ]; then
            cat > buildozer.spec << 'SPEC'
[app]
title = ${{ github.event.client_payload.app_name }}
package.name = myapp
package.domain = org.test
source.dir = .
source.include_exts = py,png,jpg,kv,atlas,json,txt,ttf
version = 1.0
requirements = python3,kivy,jnius
orientation = portrait
fullscreen = 0
android.permissions = INTERNET
android.api = 33
android.minapi = 21
android.ndk = 25b
android.archs = arm64-v8a,armeabi-v7a
android.accept_sdk_license = True
android.allow_backup = True
[buildozer]
log_level = 2
warn_on_root = 1
SPEC
          fi
      
      - name: Build APK
        run: |
          cd app_source
          buildozer android debug 2>&1 | tee build.log
      
      - name: Upload APK to Telegram
        if: always()
        run: |
          cd app_source
          APK_FILE=$(find bin -name "*.apk" 2>/dev/null | head -n 1)
          
          if [ -z "$APK_FILE" ]; then
            # Send failure message with log tail
            LOG_TAIL=$(tail -20 build.log 2>/dev/null || echo "No log available")
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ github.event.client_payload.chat_id }}" \
              -d text="❌ فشل البناء. آخر السجل:
$LOG_TAIL"
            exit 1
          fi
          
          SIZE=$(stat -c%s "$APK_FILE")
          if [ $SIZE -gt 50000000 ]; then
            URL=$(curl -s -F "reqtype=fileupload" -F "fileToUpload=@$APK_FILE" https://catbox.moe/user/api.php)
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ github.event.client_payload.chat_id }}" \
              -d text="✅ تم البناء! الحجم كبير، حمله من هنا: $URL"
          else
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendDocument" \
              -F chat_id="${{ github.event.client_payload.chat_id }}" \
              -F document=@"$APK_FILE" \
              -F caption="✅ تم بناء تطبيقك بنجاح!"
          fi
