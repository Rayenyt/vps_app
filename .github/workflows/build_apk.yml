name: Build APK
on:
  repository_dispatch:
    types: [build-apk]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev
          pip install buildozer cython virtualenv
      - run: |
          curl -f -L -o app.zip "${{ github.event.client_payload.zip_url }}"
          mkdir app_source && unzip -q app.zip -d app_source && cd app_source
          if [ ! -f "buildozer.spec" ]; then
            printf '[app]\ntitle = ${{ github.event.client_payload.app_name }}\npackage.name = myapp\npackage.domain = org.test\nsource.dir = .\nsource.include_exts = py,png,jpg,kv,atlas\nversion = 1.0\nrequirements = python3,kivy\norientation = portrait\nandroid.permissions = INTERNET\nandroid.api = 33\nandroid.minapi = 21\nandroid.archs = arm64-v8a\nandroid.accept_sdk_license = True\n[buildozer]\nlog_level = 2\n' > buildozer.spec
          fi
          buildozer android debug
      - run: |
          cd app_source
          APK=$(find bin -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" -d chat_id="${{ github.event.client_payload.chat_id }}" -d text="فشل البناء"
            exit 1
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendDocument" -F chat_id="${{ github.event.client_payload.chat_id }}" -F document=@"$APK" -F caption="تم البناء"