name: Build APK via Telegram
on:
  repository_dispatch:
    types: [build-apk]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          pip install buildozer cython virtualenv
      - name: Prepare source
        run: |
          curl -f -L -o app.zip "${{ github.event.client_payload.zip_url }}"
          mkdir app_source
          unzip -q app.zip -d app_source
          cd app_source
          if [ ! -f "buildozer.spec" ]; then
            echo '[app]' > buildozer.spec
            echo "title = ${{ github.event.client_payload.app_name }}" >> buildozer.spec
            echo 'package.name = myapp' >> buildozer.spec
            echo 'package.domain = org.test' >> buildozer.spec
            echo 'source.dir = .' >> buildozer.spec
            echo 'source.include_exts = py,png,jpg,kv,atlas,json,txt,ttf' >> buildozer.spec
            echo 'requirements = python3,kivy' >> buildozer.spec
            echo 'android.permissions = INTERNET' >> buildozer.spec
            echo 'android.api = 33' >> buildozer.spec
            echo 'android.archs = arm64-v8a,armeabi-v7a' >> buildozer.spec
            echo 'android.accept_sdk_license = True' >> buildozer.spec
            echo '[buildozer]' >> buildozer.spec
            echo 'log_level = 2' >> buildozer.spec
          fi
      - name: Build
        run: cd app_source && buildozer android debug
      - name: Upload APK
        run: |
          cd app_source
          APK=$(find bin -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ github.event.client_payload.chat_id }}" -d text="فشل البناء"
            exit 1
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendDocument" \
            -F chat_id="${{ github.event.client_payload.chat_id }}" \
            -F document=@"$APK" -F caption="✅ تم"